name: 'Rebol-Blend2D CI'
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: true
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.4
    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build 64bit static Blend2d library
      run: ./siskin Rebol-Blend2D.nest cmake-blend2d-x64

    - name: Build 64bit Rebol Blend2d extension
      run: ./siskin Rebol-Blend2D.nest --msvc -o ./blend2d-windows-x64.rebx blend2d-windows-x64

    - name: Test extension
      run:  ./siskin --script ci-test.r3
    - name: Test extension examples
      run:  ./siskin --script test/examples.r3

    ###############################################################################
    # Collecting build artifacts...
    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-Blend2D-CI-windows-${{github.run_id}}
        path: ./*.rebx


  macos-x64:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.4
      with:
        arch: aarch64
    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build 64bit static Blend2d library
      run: ./siskin Rebol-Blend2D.nest cmake-blend2d-x64

    - name: Build 64bit Rebol Blend2d extension
      run: ./siskin Rebol-Blend2D.nest --gzip -o ./blend2d-macos-x64.rebx blend2d-macos-x64

    - name: Install Siskin Builder (Intel version)
      uses: oldes/install-siskin@v0.23.4
    - name: Test extension
      run:  ./siskin --script ci-test.r3
    - name: Test extension examples
      run:  ./siskin --script test/examples.r3

    ###############################################################################
    # Collecting build artifacts...
    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-Blend2D-CI-macos-${{github.run_id}}
        path: ./*.rebx.gz

  macos-arm64:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.4
      with:
        arch: aarch64
    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build 64bit static Blend2d library
      run: ./siskin Rebol-Blend2D.nest cmake-blend2d-arm64

    - name: Build 64bit Rebol Blend2d extension
      run: ./siskin Rebol-Blend2D.nest --gzip -o ./blend2d-macos-arm64.rebx blend2d-macos-arm64

    - name: Test extension
      run:  ./siskin --script ci-test.r3
    - name: Test extension examples
      run:  ./siskin --script test/examples.r3

    ###############################################################################
    # Collecting build artifacts...
    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-Blend2D-CI-macos-${{github.run_id}}
        path: ./*.rebx.gz


  linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.4
    - name: Set Siskin locations
      shell: bash
      run: |
        tee -a "$GITHUB_ENV" <<EOF
        SISKIN_TEMP=$RUNNER_TEMP/siskin
        SISKIN_INSTALL=$GITHUB_WORKSPACE/deps
        REBOL_MODULES_DIR=$GITHUB_WORKSPACE
        EOF

    - name: Build 64bit static Blend2d library
      run: ./siskin Rebol-Blend2D.nest cmake-blend2d-x64

    - name: Build 64bit Rebol Blend2d extension
      run: ./siskin Rebol-Blend2D.nest --gzip -o ./blend2d-linux-x64.rebx blend2d-linux-x64

    - name: Test extension
      run:  ./siskin --script ci-test.r3
    - name: Test extension examples
      run:  ./siskin --script test/examples.r3

    ###############################################################################
    # Collecting build artifacts...
    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-Blend2D-CI-linux-${{github.run_id}}
        path: ./*.rebx.gz
 
